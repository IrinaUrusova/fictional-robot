version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ba_nginx
    depends_on:
      - web
      - api
      - n8n
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped
    networks: [backend]

  web:
    image: node:22-alpine
    container_name: ba_web
    working_dir: /app
    command: sh -c "npm i -g serve && serve -s . -l 3000"
    volumes:
      - ./apps/web:/app
    restart: unless-stopped
    networks: [backend]

  api:
    image: node:22-alpine
    container_name: ba_api
    working_dir: /app
    command: sh -c "node server.js"
    env_file: .env.prod
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps/api:/app
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks: [backend]

  worker:
    image: node:22-alpine
    container_name: ba_worker
    working_dir: /app
    command: sh -c "node worker.js"
    env_file: .env.prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps/worker:/app
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks: [backend]

  postgres:
    image: postgres:16-alpine
    container_name: ba_postgres
    env_file: .env.prod
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-alpine
    container_name: ba_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks: [backend]

  n8n:
    image: n8nio/n8n:latest
    container_name: ba_n8n
    env_file: .env.prod
    environment:
      - N8N_HOST=n8n.local
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - postgres
      - redis
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks: [backend]

volumes:
  pg_data:
  redis_data:
  n8n_data:

networks:
  backend:
    driver: bridge
